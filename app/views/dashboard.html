<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Читалка</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- User Profile Section -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-md p-6 sticky top-4">
                    <div class="flex flex-col items-center mb-6">
                        <div class="w-24 h-24 rounded-full bg-blue-100 flex items-center justify-center mb-4">
                            <i data-feather="user" class="w-12 h-12 text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800" id="user-name">Иван Иванов</h2>
                        <p class="text-gray-600" id="user-email">ivan@example.com</p>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-700">Баланс:</span>
                            <span class="font-bold" id="user-balance">500 ₽</span>
                        </div>
                        
                        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                            <i data-feather="plus" class="w-4 h-4 mr-2"></i>
                            Пополнить баланс
                        </button>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="lg:col-span-2 space-y-8">
                <!-- File Upload Section -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Загрузить документ</h2>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                        <i data-feather="upload" class="w-12 h-12 text-gray-400 mx-auto mb-4"></i>
                        <p class="text-gray-600 mb-4">Перетащите сюда файл .txt или нажмите для выбора</p>
                        <input type="file" id="file-upload" class="hidden" accept=".txt">
                        <label for="file-upload" class="inline-block bg-blue-600 hover:bg-blue-700 text-white py-2 px-6 rounded-lg cursor-pointer transition duration-300">
                            Выбрать файл
                        </label>
                        <p class="text-sm text-gray-500 mt-2" id="file-name">Файл не выбран</p>
                    </div>
                    <button id="process-btn" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded-lg font-medium transition duration-300 disabled:opacity-50" disabled>
                        <i data-feather="cpu" class="w-5 h-5 mr-2 inline"></i>
                        Обработать документ
                    </button>
                </div>

                <!-- Documents List -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Мои документы</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Название</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Дата</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Статус</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Действия</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="documents-list">
                                <!-- Documents will be loaded here -->
                                <tr>
                                    <td colspan="4" class="px-6 py-4 text-center text-gray-500">Нет загруженных документов</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Document Preview Modal -->
        <div id="document-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
                <div class="flex justify-between items-center border-b border-gray-200 px-6 py-4">
                    <h3 class="text-lg font-bold text-gray-800" id="modal-title">Результат обработки</h3>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-500">
                        <i data-feather="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto max-h-[70vh]">
                    <div class="flex flex-col gap-6" id="document-content">
                        <!-- Document content will be loaded here -->
                    </div>
                </div>
<div class="border-t border-gray-200 px-6 py-4 flex justify-end">
                    <button id="download-result" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-6 rounded-lg transition duration-300">
                        <i data-feather="download" class="w-4 h-4 mr-2"></i>
                        Скачать результат
                    </button>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script>
        feather.replace();
        
        // File upload handling
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const processBtn = document.getElementById('process-btn');
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = e.target.files[0].name;
                processBtn.disabled = false;
            } else {
                fileNameDisplay.textContent = 'Файл не выбран';
                processBtn.disabled = true;
            }
        });

        // Modal handling
        const modal = document.getElementById('document-modal');
        const closeModalBtn = document.getElementById('close-modal');
        
        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // Sample document data (would be loaded from API in real app)
        const sampleDocuments = [
            {
                id: 1,
                name: "Гарри Поттер глава 1.txt",
                date: "2023-05-15",
                status: "Обработан",
                content: {
                    original: "Harry Potter was a highly unusual boy in many ways. For one thing, he hated the summer holidays more than any other time of year. For another, he really wanted to do his homework but was forced to do it in secret, in the dead of night. And he also happened to be a wizard.",
                    translated: "Гарри Поттер был весьма необычным мальчиком во многих отношениях. Во-первых, он ненавидел летние каникулы больше, чем любое другое время года. Во-вторых, он очень хотел делать домашнюю работу, но был вынужден делать это тайком, в глухую ночь. И, кроме того, он оказался волшебником."
                }
            },
            {
                id: 2,
                name: "Война и мир отрывок.txt",
                date: "2023-05-10",
                status: "Обработан",
                content: {
                    original: "All happy families are alike; each unhappy family is unhappy in its own way. Everything was in confusion in the Oblonskys' house. The wife had discovered that the husband was carrying on an intrigue with a French girl, who had been a governess in their family.",
                    translated: "Все счастливые семьи похожи друг на друга, каждая несчастливая семья несчастлива по-своему. В доме Облонских всё смешалось. Жена узнала, что муж был в связи с бывшею в их доме француженкою-гувернанткой."
                }
            }
        ];
// Render documents list
        const documentsList = document.getElementById('documents-list');
        
        function renderDocumentsList() {
            if (sampleDocuments.length === 0) {
                documentsList.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-4 text-center text-gray-500">Нет загруженных документов</td>
                    </tr>
                `;
                return;
            }

            documentsList.innerHTML = sampleDocuments.map(doc => `
                <tr class="hover:bg-gray-50 cursor-pointer" data-id="${doc.id}">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <i data-feather="file-text" class="w-5 h-5 text-gray-400 mr-2"></i>
                            <span class="text-sm font-medium text-gray-900">${doc.name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${doc.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                            ${doc.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button class="text-blue-600 hover:text-blue-900 view-doc">Просмотр</button>
                    </td>
                </tr>
            `).join('');

            // Add event listeners to view buttons
            document.querySelectorAll('.view-doc').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const docId = btn.closest('tr').getAttribute('data-id');
                    viewDocument(docId);
                });
            });

            // Add event listeners to table rows
            document.querySelectorAll('#documents-list tr[data-id]').forEach(row => {
                row.addEventListener('click', () => {
                    const docId = row.getAttribute('data-id');
                    viewDocument(docId);
                });
            });

            feather.replace();
        }

        function viewDocument(docId) {
            const doc = sampleDocuments.find(d => d.id == docId);
            if (!doc) return;

            document.getElementById('modal-title').textContent = doc.name;
            const contentDiv = document.getElementById('document-content');
            // Split text into sentences
            const sentences = doc.content.original.split(/(?<=[.!?])\s+/);
            const translations = doc.content.translated.split(/(?<=[.!?])\s+/);
            
            // Show every 3rd sentence as "difficult" (for demo)
            let contentHTML = '';
            sentences.forEach((sentence, i) => {
                const isDifficult = i % 3 === 0; // Demo logic - mark every 3rd sentence as difficult
                
                contentHTML += `
                    <div class="bg-white p-4 rounded-lg border ${isDifficult ? 'border-blue-200 bg-blue-50' : 'border-gray-200'}">
                        <div class="flex justify-between items-start mb-2">
                            <p class="text-gray-800">${sentence}</p>
                            ${isDifficult ? `
                                <button class="text-blue-600 hover:text-blue-800 text-sm font-medium show-translation" data-index="${i}">
                                    <i data-feather="chevron-down" class="w-4 h-4"></i> Показать перевод
                                </button>
                            ` : ''}
                        </div>
                        <div class="translation hidden bg-gray-50 p-3 rounded mt-2" data-index="${i}">
                            <p class="text-gray-700">${translations[i] || 'Перевод недоступен'}</p>
                        </div>
                    </div>
                `;
            });
            
            contentDiv.innerHTML = contentHTML;
            
            // Add event listeners for translation toggles
            document.querySelectorAll('.show-translation').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.getAttribute('data-index');
                    const translation = document.querySelector(`.translation[data-index="${index}"]`);
                    const icon = e.target.querySelector('i');
                    
                    translation.classList.toggle('hidden');
                    if (translation.classList.contains('hidden')) {
                        icon.setAttribute('data-feather', 'chevron-down');
                        e.target.textContent = ' Показать перевод';
                    } else {
                        icon.setAttribute('data-feather', 'chevron-up');
                        e.target.textContent = ' Скрыть перевод';
                    }
                    feather.replace();
                });
            });
modal.classList.remove('hidden');
        }

        // Initial render
        renderDocumentsList();
    </script>
    <script src="script.js"></script>
</body>
</html>
