version: "3.8"
services: 
  app:
    build: ./app/
    image: reader-api:1.0.0
    container_name: reader-api
    restart: unless-stopped
    env_file:
    - ./app/.env
    volumes:
      - ./app:/app
    depends_on:
      - database
      - rabbitmq
    networks:
      - reader-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  web-proxy:
    image: nginx:1.29.4-alpine
    container_name: reader-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - reader-network
  rabbitmq:
    image: rabbitmq:4.1.7-management-alpine
    container_name: rabbitmq
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - reader-network
  database:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - reader-network

volumes:
  rabbitmq_volume:
  postgres_volume:

networks:
  reader-network:
    name: reader-network
    driver: bridge
